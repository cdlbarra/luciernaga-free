services:
  - type: web
    name: luciernaga-ingestor-v2
    runtime: python311
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd ingestor && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
